name: CI/CD Pipeline — ShopUA

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # ==========================================
  # JOB 1: Lint & Static Analysis (Member 1)
  # ==========================================
  lint:
    name: 🔍 Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ✅ Check Django configuration
        run: python manage.py check

  # ==========================================
  # JOB 2: Tests (Member 2)
  # ==========================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🗄️ Run migrations
        run: python manage.py migrate

      - name: 🧪 Run tests
        run: python manage.py test shop --verbosity=2

      - name: 📊 Run tests with coverage
        run: |
          pip install coverage
          coverage run manage.py test shop
          coverage report --min-coverage=60
          coverage xml

      - name: 📈 Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # ==========================================
  # JOB 3: Docker Build & Test (Member 1)
  # ==========================================
  docker-build:
    name: 🐳 Docker Build & Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker image
        run: |
          docker build -t shopua:test .
          echo "Docker image built successfully ✅"

      - name: 🚀 Start containers with docker-compose
        run: |
          docker compose up -d
          echo "Waiting for container to start..."
          sleep 20

      - name: ❤️ Health check — container running
        run: |
          docker compose ps
          docker compose logs web

      - name: 🧪 Run tests inside Docker container
        run: |
          docker compose exec -T web python manage.py test shop --verbosity=2

      - name: 🌐 Test HTTP endpoint
        run: |
          sleep 5
          curl -f http://localhost:8000/ || echo "Endpoint check done"

      - name: 🛑 Stop containers
        if: always()
        run: docker compose down

  # ==========================================
  # JOB 4: Deploy Summary (Member 2)
  # ==========================================
  deploy-summary:
    name: 📋 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [lint, test, docker-build]
    if: always()
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📋 Print deployment summary
        run: |
          echo "=========================================="
          echo "  ShopUA CI/CD Pipeline — Summary"
          echo "=========================================="
          echo "Репозиторій : ${{ github.repository }}"
          echo "Гілка       : ${{ github.ref_name }}"
          echo "Коміт       : ${{ github.sha }}"
          echo "Тригер      : ${{ github.event_name }}"
          echo ""
          echo "Статуси:"
          echo "  Lint:         ${{ needs.lint.result }}"
          echo "  Tests:        ${{ needs.test.result }}"
          echo "  Docker Build: ${{ needs.docker-build.result }}"
          echo ""
          if [ "${{ needs.lint.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.docker-build.result }}" = "success" ]; then
            echo "✅ Pipeline завершено успішно!"
          else
            echo "❌ Pipeline завершено з помилками"
          fi
